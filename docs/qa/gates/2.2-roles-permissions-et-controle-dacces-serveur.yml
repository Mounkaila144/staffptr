nfr_validation:
  security:
    status: PASS
    notes: "DELETE refusé par défaut et limité par exception motivée aux deux pivots d'affectation ; roles/permissions/role_has_permissions restent un catalogue non supprimable par le compte applicatif (preuve MySQL, erreur 1142). Comptes et hôtes des GRANT validés par regex avant interpolation SQL. Permissions client strictement décoratives, jamais utilisées comme barrière serveur."
  performance:
    status: PASS
    notes: "Cache interne de spatie/laravel-permission invalidé automatiquement à chaque écriture (PERM-08 vérifié par test avant/après révocation sur HandleInertiaRequests::share()). Budget de navigation (300 Ko / 80 Ko) toujours respecté selon le contrôle CI Frontend Build & Budget."
  reliability:
    status: PASS
    notes: "Échec d'audit annule le pivot dans la même transaction, prouvé par un AuditLogger mocké qui lève après l'opération ; l'absence de ligne en base et l'état en mémoire du modèle sont tous deux vérifiés."
  maintainability:
    status: CONCERNS
    notes: "RoleAssignmentService et le catalogue sont propres et bien testés. Le point faible est hors du périmètre strict de cette story : la navigation front reste couplée à un jeu de permissions de fixture désormais orphelin (UX-001), une dette identifiée mais non résorbée."

recommended_status: "✓ Ready for Done — un point de vigilance à faible sévérité (UX-001, désalignement du contrat de permissions côté navigation front, sans impact actuel), à traiter en ouverture de la story 2.4."
