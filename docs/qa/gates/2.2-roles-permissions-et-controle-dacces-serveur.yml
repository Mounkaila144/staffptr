schema: 1
story: "2.2"
story_title: "Rôles, permissions et contrôle d'accès serveur"
gate: PASS
status_reason: "Les sept AC sont prouvés, y compris les trois pièges explicitement signalés par la story : absence de Gate::before() (scan récursif de app/ et bootstrap/), exception DELETE strictement limitée aux deux pivots model_has_roles/model_has_permissions (preuve MySQL, erreur 1142 sur roles/permissions/role_has_permissions), et convention de nommage depense.approuver unique. La règle bloquante 9 est prouvée à trois niveaux (HTTP 403, Gate de policy, absence de raccourci global). CI verte sur les six contrôles dont PHPUnit sous MySQL 8."
reviewer: "Quinn (Test Architect)"
updated: "2026-07-20T09:15:00+01:00"

waiver: { active: false }

top_issues:
  - id: "UX-001"
    severity: low
    finding: "Le contrat auth.permissions calculé par HandleInertiaRequests utilise désormais les vraies permissions du catalogue (depense.approuver, compte.technique.gerer, role:direction…), mais navigationByRole dans resources/js/Composables/usePermissions.js filtre toujours sur des clés de fixture (accounts.view, approvals.view, navigation.home…) héritées de la story 1.7. Recoupement direct des deux listes : aucune intersection. Le Dev Note de 2.2 demandait de corriger le côté qui diverge ; seul le côté serveur l'a été. Impact actuel nul — aucun écran authentifié n'existe encore — mais la première page réelle de la story 2.4 afficherait une navigation primaire vide pour tous les rôles, Accueil compris."
    suggested_action: "En ouverture de la story 2.4 : aligner les clés `permission` de navigationByRole sur le catalogue réel (ou traiter les entrées sans permission, à commencer par Accueil, comme toujours visibles) et ajouter un test de non-régression qui vérifie une primaryNavigation non vide pour un jeu de permissions réel par rôle."
    suggested_owner: "dev"

