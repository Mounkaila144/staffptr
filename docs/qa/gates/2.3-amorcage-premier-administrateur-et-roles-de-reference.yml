status_reason: "Les 12 AC sont prouvés, chacun par un test nommé et traçable. Le piège principal de la story (lire l'état réel du serveur, pas le dépôt) est résolu par une fonction SQL SECURITY DEFINER qui donne au compte applicatif une réponse booléenne sur les déclencheurs d'audit sans lui accorder le privilège TRIGGER — prouvé positivement et négativement. L'analyse SHOW GRANTS tolère MySQL 8 et MariaDB 10.11 et échoue explicitement sur tout format non reconnu. CI verte sur les six contrôles, y compris PHPUnit sous MySQL 8 avec preuves par injection d'écart pour les quatre invariants."
