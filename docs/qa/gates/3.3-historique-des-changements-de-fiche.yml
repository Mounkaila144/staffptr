story: "3.3"
story_title: "Historique des changements de fiche"
gate: PASS
status_reason: "Les 5 AC sont prouvés, chacun par un test nommé et traçable. Le cœur de la story — un second registre lisible qui coexiste avec le journal d'audit sans le remplacer (AC 3) — est vérifié par deux tests : coexistence audit+historique distincts, et rollback complet de la transaction métier si l'historisation échoue. L'immuabilité (AC 4) reprend à l'identique les trois barrières d'audit_logs et est prouvée en base (déclencheur 1644) ET en applicatif (trait + privilège 1142). L'autorisation (AC 5) réutilise exactement celle de 3.2 : super_admin n'a pas fiche.consulter et aucun bypass Gate::before n'existe, refus 403 vérifié pour un pair et pour super_admin. Un seul point Low, non bloquant : la déduplication par libellé peut omettre un changement réel si deux services/responsables partagent le même nom d'affichage."
reviewer: "Quinn (Test Architect)"
updated: "2026-07-21T10:30:00+01:00"

