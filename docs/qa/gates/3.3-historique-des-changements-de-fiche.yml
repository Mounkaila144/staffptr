nfr_validation:
  security:
    status: PASS
    notes: "Autorisation réutilisée de 3.2 sans nouvelle permission (middleware fiche.consulter + policy view avec Person::visibleTo). Refus super_admin vérifié en négatif : absent de permission-catalog.php, aucun bypass Gate::before. Immuabilité triple-barrière (déclencheurs, privilèges SELECT/INSERT, trait Immutable) tracée en base et en applicatif. user_history consigné dans docs/ops/database-users.md avec UPDATE/DELETE refusés et intégré à la checklist de lecture en négatif des SHOW GRANTS."
  performance:
    status: PASS
    notes: "Index (user_id, changed_at) adapté à la consultation par fiche. forDisplay() charge changedBy.person en eager (pas de N+1) et pagine par 20. Snapshots résolus une fois à l'écriture, jamais au rendu."
  reliability:
    status: PASS
    notes: "record() refuse toute écriture hors transaction (transactionLevel() < 1). L'échec de l'historisation annule la transaction métier ET son audit — vérifié par test dédié. changed_at stocké en UTC, rendu Africa/Niamey ; DATETIME(3) pour rétention permanente sans plafond 2038 ni conversion de fuseau."
  maintainability:
    status: PASS
    notes: "Historisation greffée sur quatre points existants et déjà audités, sans nouveau chemin ni duplication de transaction. Libellés de champ et snapshots centralisés dans UserHistoryService. Migration calquée à l'identique sur audit_logs (withinTransaction=false, DDL déclencheurs en MySQL uniquement)."

