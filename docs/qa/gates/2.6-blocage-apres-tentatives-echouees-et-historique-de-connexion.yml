story_title: "Blocage après tentatives échouées et historique de connexion"
gate: PASS
status_reason: "Les 6 AC sont prouvés, chacun par un test nommé et traçable. Le piège principal — le verrou persistant pour un numéro inconnu rouvre l'oracle d'énumération temporel fermé en 2.4 — est résolu par une empreinte HMAC déterministe qui permet de compter les tentatives par numéro sans les stocker en clair, et vérifié par un test qui compare la signature complète de deux réponses (compte connu / numéro inconnu) au seuil et après expiration de la fenêtre du limiteur. RM-18 est vérifié positivement : le blocage ne suspend jamais le compte et ne révoque aucune session active. Les deux portées cumulatives (compte, adresse) sont prouvées par les deux tests symétriques nommés dans l'AC 3. CI verte sur les six contrôles, y compris PHPUnit MySQL 8 et Playwright."
